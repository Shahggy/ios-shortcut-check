name: ShortcutLab
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTED_PLATFORMS: iphonesimulator
    GENERATE_INFOPLIST_FILE: YES
targets:
  Probe:
    type: application
    platform: iOS
    sources:
      - path: Probe/Probe.swift
      - path: Probe/ShagAttack.shortcut
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.shortcutlab.probe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  Checks:
    type: bundle.ui-testing
    platform: iOS
    sources: [Checks]
    dependencies:
      - target: Probe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.shortcutlab.checks
        TEST_TARGET_NAME: Probe
schemes:
  ShortcutLab:
    build:
      targets:
        Probe: all
        Checks: [test]
    test:
      gatherCoverageData: false
      targets: [Checks]
